[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physstudio"
version = "0.1.0"
description = "Recreating fun physics-based animation projects through vibe coding."
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<2.5", "numpy==1.26.4", "scipy==1.14.0", "Pillow==10.4.0", "plyfile==1.1", "warp-lang==1.6.2", "gsplat==1.5.3", "osqp==1.0.5", "ninja==1.11.1.3"]

[project.scripts]
physstudio = "physstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["physstudio*", "rainy_gs*", "gaussian_splashing*", "enlivening_gs*", "magnetic_mpm*", "snowy_gs*", "lava_gs*", "water_sand*", "plant_wilting*", "storm_gs*"]

[tool.setuptools.package-data]
rainy_gs = ["configs/*.json"]
lava_gs = ["configs/*.json"]
water_sand = ["LICENSE.reference", "references/*.json", "README.md"]
plant_wilting = ["LICENSE.reference", "references/*.json", "requirements-solver.txt", "README.md"]
storm_gs = ["configs/*.json", "references/*.json", "README.md"]
