[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physstudio"
version = "0.1.0"
description = "A vibe-coded world simulator for recreating and exploring physics-based animation."
requires-python = ">=3.10"
# Original code is Apache-2.0; bundled third-party components retain their licenses.
license = "Apache-2.0 AND MIT AND BSD-2-Clause AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "*/LICENSE.reference"]
dependencies = ["torch>=2.4,<2.5", "numpy==1.26.4", "scipy==1.14.0", "Pillow==10.4.0", "plyfile==1.1", "warp-lang==1.6.2", "gsplat==1.5.3", "osqp==1.0.5", "ninja==1.11.1.3", "trimesh==4.5.3", "matplotlib>=3.7,<4"]

[project.scripts]
physstudio = "physstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["physstudio*", "rainy_gs*", "gaussian_splashing*", "enlivening_gs*", "magnetic_mpm*", "snowy_gs*", "lava_gs*", "water_sand*", "plant_wilting*", "storm_gs*", "thunder_gs*", "surface_tension*", "ice_melting*", "firex_gs*", "implicit_mixture*", "ice_solidification*", "rhizomorph*", "windy_trees*", "magnetic_rigid*", "melp_thin_film*", "robot_pouring*"]

[tool.setuptools.package-data]
rainy_gs = ["configs/*.json"]
lava_gs = ["configs/*.json"]
water_sand = ["LICENSE.reference", "references/*.json", "README.md"]
plant_wilting = ["LICENSE.reference", "references/*.json", "requirements-solver.txt", "README.md"]
storm_gs = ["configs/*.json", "references/*.json", "README.md"]
thunder_gs = ["configs/*.json", "references/*.json", "README.md"]
surface_tension = ["references/*.json", "requirements.txt", "README.md", "METHOD.md"]
ice_melting = ["references/*.json", "requirements.txt", "README.md", "METHOD.md"]
firex_gs = ["configs/*.json", "references/*.json", "references/*.txt", "LICENSE.reference", "README.md", "METHOD.md"]

implicit_mixture = ["configs/*.json", "references/*.json", "requirements.txt", "README.md", "METHOD.md"]

ice_solidification = ["configs/*.json", "references/*.json", "requirements.txt", "README.md", "METHOD.md"]

rhizomorph = ["references/*.json", "LICENSE.reference", "requirements.txt", "README.md", "METHOD.md"]

windy_trees = ["references/*.json", "requirements.txt", "dense_wind.json", "README.md", "METHOD.md", "FLOW_VISUALIZATION.md"]

magnetic_rigid = ["references/*.json", "requirements.txt", "README.md", "METHOD.md", "VALIDATION.md"]

melp_thin_film = ["references/*.json", "requirements.txt", "README.md", "METHOD.md", "VALIDATION.md"]

robot_pouring = ["references/*.json", "references/*.txt", "LICENSE.reference", "requirements*.txt", "README.md", "METHOD.md", "VALIDATION.md"]
